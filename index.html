<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart Plug Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0f172a;
color:#fff;
padding:15px;
}

.container{
max-width:430px;
margin:auto;
}

.card{
background:#1e293b;
padding:18px;
border-radius:18px;
margin-bottom:15px;
box-shadow:0 0 10px rgba(0,0,0,.35);
}

h1{
text-align:center;
font-size:26px;
margin-bottom:15px;
}

h2{
font-size:18px;
margin-bottom:10px;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:12px;
margin-top:10px;
font-size:16px;
}

button{
border:none;
padding:14px;
border-radius:14px;
font-size:16px;
font-weight:bold;
cursor:pointer;
width:100%;
margin-top:10px;
color:#fff;
}

.loginBtn{
background:#2563eb;
}

.logoutBtn{
background:#ef4444;
}

.row{
display:flex;
gap:10px;
}

.row button{
flex:1;
}

.unitBtn{
background:linear-gradient(45deg,#334155,#475569);
}

.unitActive{
background:linear-gradient(45deg,#06b6d4,#0891b2);
box-shadow:0 0 10px rgba(6,182,212,.5);
}

.on{
background:linear-gradient(45deg,#16a34a,#22c55e);
}

.off{
background:linear-gradient(45deg,#dc2626,#ef4444);
}

.start{
background:linear-gradient(45deg,#2563eb,#3b82f6);
}

.stop{
background:linear-gradient(45deg,#ea580c,#f97316);
}

.status{
text-align:center;
font-size:14px;
margin-top:8px;
opacity:.9;
}

.footer{
text-align:center;
font-size:13px;
opacity:.6;
margin-top:20px;
}

.hidden{
display:none;
}
</style>
</head>

<body>

<div class="container">

<div id="loginPage" class="card">

<h1>🔐 Smart Plug</h1>

<input
type="email"
id="email"
placeholder="Email"
>

<input
type="password"
id="password"
placeholder="Password"
>

<button
class="loginBtn"
onclick="login()"
>
Login
</button>

<div
class="status"
id="loginStatus"
>
Please login
</div>

</div>

<div
id="dashboard"
class="hidden"
>

<h1>⚡ Smart Plug</h1>

<div class="card">

<h2>Relay Controls</h2>

<div class="row">

<button
id="r1"
class="off"
onclick="toggleRelay(1)"
>
Relay 1 OFF
</button>

<button
id="r2"
class="off"
onclick="toggleRelay(2)"
>
Relay 2 OFF
</button>

</div>

</div>

<div class="card">

<h2>⏱ Timer (Relay 2)</h2>

<input
type="number"
id="timeVal"
placeholder="Enter Time"
min="1"
>

<div class="row">

<button
id="secBtn"
class="unitBtn unitActive"
onclick="setsec()"
>
Second
</button>

<button
id="minBtn"
class="unitBtn"
onclick="setMin()"
>
Minute
</button>

<button
id="hourBtn"
class="unitBtn"
onclick="setHour()"
>
Hour
</button>

</div>


<!-- START STOP -->
<div class="row">

<button
class="start"
onclick="startTimer()"
>
Start
</button>

<button
class="stop"
onclick="stopTimer()"
>
Stop
</button>

</div>


<div
class="status"
id="countdown"
>
Timer OFF
</div>

</div>

<div class="card">

<h2>Status</h2>

<div
class="status"
id="onlineStatus"
>
Waiting...
</div>

<div
class="status"
id="lastUpdated"
>
Last updated: --
</div>

<button
class="loginBtn"
onclick="checkDeviceStatus()"
>
Check Status
</button>

<button
class="logoutBtn"
onclick="logout()"
>
Logout
</button>

</div>

<div class="footer">
Created by Kajol Chandr Das
</div>

</div>

</div>

<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getDatabase,
ref,
set,
onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

apiKey:
"AIzaSyD_pw2tqB_whEsddwJ_RmSidMSMbCWcQfM",

authDomain:
"esp32-remote-home-control.firebaseapp.com",

databaseURL:
"https://esp32-remote-home-control-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:
"esp32-remote-home-control",

storageBucket:
"esp32-remote-home-control.firebasestorage.app",

messagingSenderId:
"83183167672",

appId:
"1:83183167672:web:aab6882d9f03d49edc6c4d"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);

let timeUnit = "sec";

let localRemaining = 0;

let countdownTimer = null;

window.login = function(){

const userEmail =
document.getElementById("email").value.trim();

const userPassword =
document.getElementById("password").value;


if(!userEmail || !userPassword){

document.getElementById("loginStatus").innerHTML =
"Please enter email and password";

return;

}


document.getElementById("loginStatus").innerHTML =
"Logging in...";


signInWithEmailAndPassword(
auth,
userEmail,
userPassword
)

.then(()=>{

document.getElementById("loginStatus").innerHTML =
"Login Success";

})

.catch((error)=>{

document.getElementById("loginStatus").innerHTML =
error.message;

});

};

window.logout = function(){

signOut(auth);

};

onAuthStateChanged(
auth,
(user)=>{

if(user){

document
.getElementById("loginPage")
.classList
.add("hidden");

document
.getElementById("dashboard")
.classList
.remove("hidden");

listenData();

checkDeviceStatus();


}else{

document
.getElementById("loginPage")
.classList
.remove("hidden");


document
.getElementById("dashboard")
.classList
.add("hidden");


stopLocalCountdown();

}

}
);

window.toggleRelay = function(n){

document.getElementById("onlineStatus").innerHTML =
"🟡 Sending...";

if(n === 1){

const currentState =
document
.getElementById("r1")
.innerHTML
.includes("OFF");


set(
ref(db,"relay1"),
currentState
);

}

if(n === 2){

const currentState =
document
.getElementById("r2")
.innerHTML
.includes("OFF");

set(
ref(db,"relay2"),
currentState
);

}

setTimeout(
checkDeviceStatus,
1500
);

};

window.setsec = function(){

timeUnit = "sec";


document
.getElementById("secBtn")
.className =
"unitBtn unitActive";


document
.getElementById("minBtn")
.className =
"unitBtn";


document
.getElementById("hourBtn")
.className =
"unitBtn";

};

window.setMin = function(){

timeUnit = "min";

document
.getElementById("minBtn")
.className =
"unitBtn unitActive";


document
.getElementById("secBtn")
.className =
"unitBtn";


document
.getElementById("hourBtn")
.className =
"unitBtn";

};

window.setHour = function(){

timeUnit = "hr";


document
.getElementById("hourBtn")
.className =
"unitBtn unitActive";


document
.getElementById("minBtn")
.className =
"unitBtn";


document
.getElementById("secBtn")
.className =
"unitBtn";

};

window.startTimer = function(){

const val =
parseInt(
document
.getElementById("timeVal")
.value
);


if(!val || val <= 0){

document.getElementById("countdown").innerHTML =
"Enter valid time";

return;

}



let milliseconds = 0;



if(timeUnit === "sec"){

milliseconds =
val * 1000;

}


else if(timeUnit === "min"){

milliseconds =
val * 60 * 1000;

}

else if(timeUnit === "hr"){

milliseconds =
val * 60 * 60 * 1000;

}

document.getElementById("onlineStatus").innerHTML =
"🟡 Sending...";

set(
ref(db,"remaining"),
milliseconds
);

set(
ref(db,"timerActive"),
true
);

setTimeout(
checkDeviceStatus,
1500
);

};

window.stopTimer = function(){

set(
ref(db,"timerActive"),
false
);

stopLocalCountdown();

document.getElementById("countdown").innerHTML =
"Timer OFF";


setTimeout(
checkDeviceStatus,
1500
);

};

window.checkDeviceStatus = function(){

document.getElementById("onlineStatus").innerHTML =
"🟡 Checking...";

set(
ref(db,"statusReply"),
false
);

set(
ref(db,"statusRequest"),
true
);

const timeout =
setTimeout(
()=>{

document.getElementById("onlineStatus").innerHTML =
"🔴 Disconnected";

},
5000
);

onValue(
ref(db,"statusReply"),
(snapshot)=>{

if(snapshot.val() === true){

clearTimeout(timeout);


document.getElementById("onlineStatus").innerHTML =
"🟢 Connected";


document.getElementById("lastUpdated").innerHTML =
"Last updated: " +
new Date().toLocaleTimeString();

}

},
{
onlyOnce:false
}
);

};

function listenData(){

onValue(
ref(db,"/"),
(snapshot)=>{

const data =
snapshot.val();


if(!data){

return;

}

if(data.relay1){

document.getElementById("r1").innerHTML =
"Relay 1 ON";


document.getElementById("r1").className =
"on";

}else{

document.getElementById("r1").innerHTML =
"Relay 1 OFF";


document.getElementById("r1").className =
"off";

}

if(data.relay2){

document.getElementById("r2").innerHTML =
"Relay 2 ON";


document.getElementById("r2").className =
"on";

}else{

document.getElementById("r2").innerHTML =
"Relay 2 OFF";


document.getElementById("r2").className =
"off";

}

if(data.timerActive){

localRemaining =
parseInt(data.remaining || 0);

startLocalCountdown();

}else{

stopLocalCountdown();


document.getElementById("countdown").innerHTML =
"Timer OFF";

}

});

}

function startLocalCountdown(){

stopLocalCountdown();


document.getElementById("countdown").innerHTML =
formatTime(localRemaining);

countdownTimer =
setInterval(
()=>{

if(localRemaining > 0){

localRemaining -= 1000;

if(localRemaining < 0){

localRemaining = 0;

}


document.getElementById("countdown").innerHTML =
formatTime(localRemaining);


if(localRemaining === 0){

stopLocalCountdown();

document.getElementById("countdown").innerHTML =
"Timer OFF";

}

}

},
1000
);

}

function stopLocalCountdown(){

if(countdownTimer){

clearInterval(countdownTimer);

countdownTimer = null;

}

}

function formatTime(milliseconds){

milliseconds =
parseInt(milliseconds);


if(
isNaN(milliseconds) ||
milliseconds <= 0
){

return "Timer OFF";

}

let totalSeconds =
Math.floor(
milliseconds / 1000
);

let seconds =
totalSeconds % 60;

let totalMinutes =
Math.floor(
totalSeconds / 60
);

let minutes =
totalMinutes % 60;

let hours =
Math.floor(
totalMinutes / 60
);

if(hours === 0 && minutes === 0){

return seconds + " sec";

}

if(hours === 0){

return minutes +
" min " +
seconds +
" sec";

}

return hours +
" hr " +
minutes +
" min " +
seconds +
" sec";

}

</script>

</body>
</html>
